name: Check and bump addon versions

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Check and update addon versions
        id: check_update
        run: |
          set -euo pipefail

          # addon_dir | docker_image | display_name | referral_url
          ADDONS=(
            "earnapp|madereddy/earnapp|EarnApp|https://earnapp.com/i/4LLxaYrb"
            "honeygain|honeygain/honeygain|Honeygain|https://join.honeygain.com/BULINCBB47"
            "packetstream|packetstream/psclient|PacketStream|https://packetstream.io/?psr=6eJ7"
            "repocket|repocket/repocket|Repocket|https://link.repocket.com/TLMq"
            "pawns|iproyal/pawns-cli|Pawns.app|https://pawns.app/?r=7359984"
            "earnfm|earnfm/earnfm-client|earn.fm|https://earn.fm/ref/JEDRBQEQ"
            "proxyrack|proxyrack/pop|ProxyRack|https://peer.proxyrack.com/ref/7fx0rj00pt1noye23c7r2gw1sok8utlhhsjdmwys"
            "traffmonetizer|traffmonetizer/cli_v2|Traffmonetizer|https://traffmonetizer.com/?aff=1805975"
            "grass|mrcolorrain/grass-node|Grass|https://app.grass.io/register?referralCode=nQQpxyv6mNel0H8"
            "bitping|bitping/bitpingd|BitPing|https://bitping.com/earn"
          )

          get_remote_version() {
            local json
            json=$(curl -s "https://hub.docker.com/v2/repositories/$1/tags?page_size=25")
            local tag
            tag=$(echo "$json" | jq -r '.results[].name' | grep -E '^(v?[0-9])' | grep -vE 'test|cache|staging' | sort -V | tail -n 1)
            [ -z "$tag" ] && tag=$(echo "$json" | jq -r '(.results[] | select(.name == "latest") | .last_updated[:10] | gsub("-"; ".")) // empty')
            echo "${tag:-unknown}"
          }

          UPDATED=""
          RELEASE_BODY_FILE=$(mktemp)

          for entry in "${ADDONS[@]}"; do
            IFS='|' read -r addon img name url <<< "$entry"

            cfg="$addon/config.yaml"
            [ ! -f "$cfg" ] && cfg="$addon/config.yml"

            local_ver=$(yq '.version' "$cfg")
            remote_ver=$(get_remote_version "$img")

            echo "$addon: local=$local_ver remote=$remote_ver"

            if [ "$remote_ver" = "unknown" ]; then
              echo "  → skipped (fetch failed)"
              continue
            fi

            if [ "$local_ver" != "$remote_ver" ]; then
              yq -i ".version = \"$remote_ver\"" "$cfg"

              # Sync Dockerfile image tag — only when the image is already pinned
              # (i.e. not :latest). CalVer addons using :latest are left untouched.
              dockerfile="$addon/Dockerfile"
              if [ -f "$dockerfile" ] && grep -qE "(FROM|COPY --from)[[:space:]]+${img}:[^l]" "$dockerfile"; then
                new_ver=$(yq '.version' "$cfg")
                sed -i "s|\(COPY --from=${img}:\)[^ ]*|\1${new_ver}|g" "$dockerfile"
                sed -i "s|\(FROM ${img}:\)[^ ]*|\1${new_ver}|g" "$dockerfile"
              fi

              echo "  → updated $local_ver → $remote_ver"
              UPDATED="$UPDATED $addon"
              echo "- Bumped [${name}](${url}) to \`${remote_ver}\` (from \`${local_ver}\`)" >> "$RELEASE_BODY_FILE"
            fi
          done

          UPDATED="${UPDATED# }"
          echo "updated=$UPDATED" >> "$GITHUB_OUTPUT"

          {
            echo "release_body<<EOF"
            cat "$RELEASE_BODY_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          LATEST_TAG=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          IFS='.' read -r major minor patch <<< "${LATEST_TAG:-0.0.0}"
          echo "new_tag=$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"

          if [ -n "$UPDATED" ]; then
            echo "commit_message=chore: update addon versions ($UPDATED)" >> "$GITHUB_OUTPUT"
          else
            echo "commit_message=chore: no addon updates" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: ${{ steps.check_update.outputs.commit_message }}
          file_pattern: "*/config.yaml */config.yml */Dockerfile"
          tag_name: ${{ steps.check_update.outputs.new_tag }}

      - name: Create GitHub Release
        if: steps.auto_commit.outputs.changes_detected == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.check_update.outputs.new_tag }}
          name: ${{ steps.check_update.outputs.new_tag }}
          body: ${{ steps.check_update.outputs.release_body }}
